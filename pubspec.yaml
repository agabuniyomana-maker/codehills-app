name: code_hills_app
description: "Code Hills 1001 — local natural-resource business plan catalog. Rebuilt in Flutter for Android, iOS, Windows, macOS and Linux."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/pdfs/
    - assets/seed/
